<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawad Elsayed</title>

    <!-- Import Crimson Text Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            /* Light Mode (Default) */
            --bg-color: #ede6d8;
            --text-color: #191510;
            --accent-color: #5c4033;
            --icon-color: #191510;
        }

        [data-theme="dark"] {
            /* Dark Mode (Flipped) */
            --bg-color: #191510;
            --text-color: #ede6d8;
            --accent-color: #c0b3a0;
            --icon-color: #ede6d8;
        }

        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Crimson Text', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            text-align: center;
        }

        /* --- DARK MODE TOGGLE (Fixed Top Right) --- */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            color: var(--icon-color);
            transition: transform 0.3s ease;
            z-index: 10;
        }

            .theme-toggle:hover {
                transform: rotate(15deg);
            }

            .theme-toggle svg {
                width: 24px;
                height: 24px;
                fill: currentColor;
            }

        /* --- PROFILE IMAGE --- */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--text-color);
            margin-bottom: 25px;
            background-color: #ccc;
        }

        /* --- TEXT ELEMENTS --- */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.2rem;
            margin-top: 0;
            font-weight: 600;
        }

        .description {
            font-size: 1.35rem;
            color: var(--accent-color);
            margin-bottom: 2.5rem;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.5;
        }

        /* --- LINKS CONTAINER --- */
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Unified spacing for all links */
            align-items: center; /* Center align items */
        }

        /* --- LINK STYLING --- */
        a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.2rem;
            padding: 5px 0;
            position: relative;
            display: inline-flex; /* Changed to inline-flex to align icons */
            align-items: center;
            gap: 10px; /* Space between icon and text */
            transition: color 0.3s ease;
        }

            /* Link Icons */
            a svg {
                width: 20px;
                height: 20px;
                fill: currentColor;
                transition: fill 0.3s ease;
            }

            /* Underline Animation */
            a::after {
                content: '';
                position: absolute;
                width: 0;
                height: 1px;
                bottom: 0;
                left: 0;
                background-color: var(--text-color);
                transition: width 0.3s ease-in-out;
            }

            a:hover::after {
                width: 100%;
            }
    </style>
</head>
<body>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle Dark Mode">
        <svg viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" />
        </svg>
    </button>

    <!-- Profile Image -->
    <img src="jawadElsayed1.jpg" alt="Profile Picture" class="profile-img">

    <!-- Name & Description -->
    <h1 id="name">Jawad Elsayed</h1>
    <p class="description" id="desc">
        Software Engineer focused on Accessibility and User Experience. <br />Based in Metro Detroit.
    </p>

    <!-- Contact Info & Links (Unified List) -->
    <div class="contact-links">

        <!-- EMAIL -->
        <a href="mailto:your.email@example.com">
            <!-- Mail Icon -->
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" /></svg>
            jawadelsayedm@gmail.com
        </a>

        <!-- PHONE -->
        <a href="tel:+1234567890">
            <!-- Phone Icon -->
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" /></svg>
            +1 (347) 447-3702
        </a>

        <!-- LINKEDIN -->
        <a href="https://www.linkedin.com/in/jawad-mouhamad-a1a60228b/" target="_blank">
            <!-- LinkedIn Icon -->
            <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" /></svg>
            LinkedIn
        </a>

    </div>

    <script>
        // Icons for toggle
        const moonIcon = '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
        const sunIcon = '<svg viewBox="0 0 24 24"><path d="M6.995 12c0 2.761 2.246 5.007 5.007 5.007s5.007-2.246 5.007-5.007-2.246-5.007-5.007-5.007S6.995 9.239 6.995 12zM11 19h2v3h-2zm0-17h2v3h-2zm-9 9h3v2h-3zm17 0h3v2h-3zM5.637 19.778l-1.414-1.414 2.121-2.121 1.414 1.414zM16.242 6.344l2.122-2.122 1.414 1.414-2.122 2.122zM6.344 7.759 4.223 5.637l1.415-1.414 2.12 2.122zm13.434 10.605-1.414 1.414-2.122-2.122 1.414-1.414z"/></svg>';

        const themeBtn = document.getElementById('theme-btn');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'dark') {
        themeBtn.innerHTML = sunIcon;
        }
        }

        function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');

        if (current === 'dark') {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        themeBtn.innerHTML = moonIcon;
        } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.innerHTML = sunIcon;
        }
        }
    </script>
</body>
</html>
